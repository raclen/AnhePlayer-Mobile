name: Android CI
run-name: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'Main 编译与单测' || 'Debug APK 构建与单测' }}
on:
  workflow_dispatch:
  push:
    branches:
      - canary
      - main
  pull_request:
    branches:
      - '**'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # 只排除 main 的自动 push；在 main 手动运行仍允许生成 Debug 包。
      BUILD_DEBUG_APK: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Ensure Gradle wrapper distribution
        run: |
          WRAPPER_DIR="$HOME/.gradle/wrapper/dists/gradle-9.2.0-bin/11i5gvueggl8a5cioxuftxrik"
          mkdir -p "$WRAPPER_DIR"
          if [ ! -f "$WRAPPER_DIR/gradle-9.2.0-bin.zip.ok" ] && [ ! -f "$WRAPPER_DIR/gradle-9.2.0-bin.zip" ]; then
            echo "Pre-fetching Gradle 9.2.0 distribution..."
            (curl -fL --connect-timeout 10 --max-time 60 -o "$WRAPPER_DIR/gradle-9.2.0-bin.zip.tmp" "https://repo.huaweicloud.com/gradle/gradle-9.2.0-bin.zip" || \
             curl -fL --connect-timeout 10 --max-time 60 -o "$WRAPPER_DIR/gradle-9.2.0-bin.zip.tmp" "https://mirrors.cloud.tencent.com/gradle/gradle-9.2.0-bin.zip" || \
             curl -fL --connect-timeout 10 --max-time 120 -o "$WRAPPER_DIR/gradle-9.2.0-bin.zip.tmp" "https://services.gradle.org/distributions/gradle-9.2.0-bin.zip") && \
            mv "$WRAPPER_DIR/gradle-9.2.0-bin.zip.tmp" "$WRAPPER_DIR/gradle-9.2.0-bin.zip"
          fi

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --channel=1 --licenses

      # TagLib 固定使用 r29-beta1；允许 beta 渠道，但只安装项目声明的具体版本。
      - name: Install pinned native build tools
        if: env.BUILD_DEBUG_APK == 'true'
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --channel=1 --install "cmake;3.31.6" "ndk;29.0.13113456"
          /usr/local/lib/android/sdk/cmake/3.31.6/bin/cmake --version

      - name: Compile main and run jvm tests
        if: env.BUILD_DEBUG_APK == 'false'
        run: ./gradlew :app:compileCoreDebugKotlin :app:testCoreDebugUnitTest --no-daemon -Dkotlin.incremental=false --stacktrace -DskipFormatKtlint

      - name: Build debug APK and run jvm tests
        if: env.BUILD_DEBUG_APK == 'true'
        run: ./gradlew assembleCoreDebug testCoreDebugUnitTest --stacktrace -DskipFormatKtlint

      - name: Run Android Lint
        if: env.BUILD_DEBUG_APK == 'true'
        continue-on-error: true
        run: ./gradlew lintCoreDebug --stacktrace -DskipFormatKtlint

      - name: Upload APK
        if: env.BUILD_DEBUG_APK == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app/build/outputs/apk/core/debug/*.apk
