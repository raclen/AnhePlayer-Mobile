name: Build APKs for release
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.KEYSTORE != '' && secrets.KEYSTORE_PROPERTIES != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Setup signing configs
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: |
          echo "$KEYSTORE" | base64 --decode > test.jks
          echo "$KEYSTORE_PROPERTIES" > keystore.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}

      - name: Get date-time string
        id: datetime
        run: |
          DATE_TAG=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "date_tag=$DATE_TAG" >> $GITHUB_ENV

      - name: Build core release APK
        run: ./gradlew assembleCoreRelease

      - name: Extract current version changelog
        id: changelog
        run: |
          python3 - << 'EOF'
          import os

          tag = os.environ.get('TAG_NAME', '')
          changelog_path = 'CHANGELOG.md'
          output_path = 'release_notes.md'

          if not os.path.exists(changelog_path):
              with open(output_path, 'w', encoding='utf-8') as f:
                  f.write(f"# AnhePlayer {tag}\n")
              exit(0)

          with open(changelog_path, 'r', encoding='utf-8') as f:
              lines = f.readlines()

          current_block = []
          in_target_version = False

          # 如果有指定 tag (如 v1.0.18)，匹配指定版本的段落；否则匹配第一段 # AnhePlayer v
          target_header_prefix = f"# AnhePlayer {tag}" if tag else ""

          for line in lines:
              if line.startswith('# AnhePlayer v'):
                  if not in_target_version:
                      if not target_header_prefix or line.strip().startswith(target_header_prefix):
                          in_target_version = True
                          current_block.append(line)
                  else:
                      break
              elif in_target_version:
                  current_block.append(line)

          if not current_block:
              # 回退策略：取第一段版本的 changelog
              for line in lines:
                  if line.startswith('# AnhePlayer v'):
                      if not current_block:
                          current_block.append(line)
                      else:
                          break
                  elif current_block:
                      current_block.append(line)

          with open(output_path, 'w', encoding='utf-8') as f:
              if current_block:
                  f.writelines(current_block)
              else:
                  f.write(f"# AnhePlayer {tag}\n")
          EOF
        env:
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Create github release draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', env.date_tag) }}
          name: "AnhePlayer ${{ github.ref_type == 'tag' && github.ref_name || format('build-{0}', env.date_tag) }}"
          draft: false
          body_path: release_notes.md
          files: |
            app/build/outputs/apk/core/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.REL_TOKEN || github.token }}
