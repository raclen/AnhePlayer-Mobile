name: Build APKs for pre release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_SIGNING: ${{ secrets.KEYSTORE != '' && secrets.KEYSTORE_PROPERTIES != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "temurin"
          cache: 'gradle'

      - name: Accept SDK licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --channel=1 --licenses

      # TagLib 固定使用 r29-beta1；允许 beta 渠道，但只安装项目声明的具体版本。
      - name: Install pinned native build tools
        run: |
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --channel=1 --install "cmake;3.31.6" "ndk;29.0.13113456"
          /usr/local/lib/android/sdk/cmake/3.31.6/bin/cmake --version

      - name: Setup signing configs
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: |
          echo "$KEYSTORE" | base64 --decode > test.jks
          echo "$KEYSTORE_PROPERTIES" > keystore.properties
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}

      - name: Get date-time string
        id: datetime
        run: |
          DATE_TAG=$(date +'%Y-%m-%d_%H-%M-%S')
          echo "date_tag=$DATE_TAG" >> $GITHUB_ENV

      - name: Build core userdebug APK
        run: ./gradlew assembleCoreUserdebug

      - name: Create github userdebug draft
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ env.date_tag }}
          name: "Build ${{ env.date_tag }}"
          draft: true
          files: |
            app/build/outputs/apk/core/userdebug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.REL_TOKEN || github.token }}
